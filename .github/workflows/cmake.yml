name: Build unsigned Nuke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: raspberrypi/pico-sdk
          ref: '2.3.1'
          path: pico-sdk
          submodules: true
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - name: Test erase sequencing without hardware
        run: |
          cc -std=c11 -Wall -Wextra -Werror -DPICO_NO_FLASH=1 -I tests/stubs tests/nuke_test.c -o /tmp/nuke-test
          /tmp/nuke-test
          cc -std=c11 -Wall -Wextra -Werror -DPICO_NO_FLASH=1 -DPICO_RP2040=1 -I tests/stubs tests/nuke_test.c -o /tmp/nuke-test-rp2040
          /tmp/nuke-test-rp2040
      - name: Build unsigned firmware
        run: |
          cmake -S . -B build -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=waveshare_rp2350_one -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
      - uses: actions/upload-artifact@v6
        with:
          name: pico-nuke-all-unsigned
          path: build/flash_nuke.uf2
